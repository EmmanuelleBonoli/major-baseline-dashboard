server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Derrière Traefik (TLS terminé en amont, nginx ne voit que du HTTP) :
    # évite que les redirections auto (ex. try_files $uri/) émettent une
    # URL absolue en http:// au lieu de https://.
    absolute_redirect off;

    # En-têtes de sécurité.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/ld+json
               application/xml application/rss+xml application/manifest+json
               image/svg+xml;

    # SPA + pages pré-rendues (vite-ssg) : toutes les routes retombent sur un
    # fichier HTML statique, sinon sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Le HTML n'est pas versionné par un hash -> toujours revalidé pour que le
    # contenu pré-rendu se mette à jour au déploiement suivant.
    location ~* \.html$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "no-cache" always;
    }

    # Proxy vers le backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets applicatifs (hashés par Vite) : cache long et immuable.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        add_header X-Content-Type-Options "nosniff" always;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
}