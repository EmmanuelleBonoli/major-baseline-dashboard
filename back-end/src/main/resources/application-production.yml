spring:
  datasource:
    url: jdbc:mysql://${DB_HOST_PROD}:${DB_PORT_PROD}/${DB_NAME_PROD}?createDatabaseIfNotExist=true
    username: ${DB_USER_PROD}
    password: ${DB_PASSWORD_PROD}

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expiration-time: ${JWT_EXP_TIME}

springdoc:
  swagger-ui:
    enabled: false

cors:
  allowedOrigins: ${CLIENT_URL_PROD}

logging:
  level:
    com.appdashboard: INFO

custom:
  api-url: ${API_URL_PROD}
  client-url: ${CLIENT_URL_PROD}
  contact-email: ${CONTACT_EMAIL_DESTINATION}

# Identifiants stores optionnels : les services Store tournent en mock pour
# l'instant, un défaut vide suffit à démarrer sans les vraies clés.
stores:
  google-play:
    service-account-json: ${GOOGLE_PLAY_SERVICE_ACCOUNT:}
  apple:
    key-id: ${APPLE_KEY_ID:}
    issuer-id: ${APPLE_ISSUER_ID:}
    private-key: ${APPLE_PRIVATE_KEY:}